services:
  - type: web
    name: piga-track
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig*.json
        - biome.json
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
